[pytest]
# `tests` contains the current Day4 provider, deadline, guardrail, budget, and
# source-evidence integration regressions. `tests_day4` is retained as the
# explicit integration-test entry point for future Day4 additions.
testpaths = tests tests_day4 agent_day3/tests agent_day3/evals/test_corpus.py evidence_review/tests
addopts = --ignore=agent_day3/tests/test_dev_http.py --ignore=agent_day3/tests/test_dev_bridge_and_compat.py --ignore=agent_day3/tests/test_dev_trace_validation.py --ignore=agent_day3/tests/test_dev_roles.py
